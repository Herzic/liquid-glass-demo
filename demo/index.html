<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Liquid Glass v3 — демо</title>
<link rel="stylesheet" href="demo.css?v=v3-20261101">
</head>
<body>
<img id="wall" class="wall" src="assets/bg1.jpg?v=v3-20261101" alt="">
<canvas id="wallc" class="wall" hidden></canvas>
<main id="feed"><canvas id="sheet"></canvas></main>

<!-- стеклянный UI (над WebGL-слоем) -->
<header class="topbar g" id="topbar"><b>Liquid Glass</b><small id="fps">—</small></header>
<button class="circ g top1" id="btnWall" aria-label="Обои">◐</button>
<button class="circ g top2" id="btnSet" aria-label="Настройки">⚙︎</button>

<div class="mini g" id="mini">
  <span class="art" id="miniArt"></span>
  <span class="mt"><b>Жидкое стекло</b><small>Apple Design Team</small></span>
  <button class="ic" id="play" aria-label="Пауза">❚❚</button><button class="ic" aria-label="Далее">▶▶</button>
</div>
<nav class="tabbar g" id="tabbar">
  <span class="ind" id="ind"></span>
  <button class="tab on"><i>⌂</i>Главная</button><button class="tab"><i>▦</i>Медиатека</button><button class="tab"><i>◉</i>Радио</button><button class="tab" id="tabCC"><i>☰</i>Пункт</button>
</nav>
<button class="circ g search" id="search" aria-label="Поиск">⌕</button>

<div id="lens" class="g lens"><span>тяни</span></div>

<!-- Пункт управления -->
<section id="cc" class="cc" hidden>
  <div class="tiles">
    <div class="tile g conn">
      <button class="tg on g2">✈︎</button><button class="tg on">⦿</button><button class="tg">≋</button><button class="tg on">ᛒ</button>
    </div>
    <div class="tile g music"><span class="art" id="ccArt"></span><b>Жидкое стекло</b><small>Apple Design Team</small>
      <div class="ctr"><button class="ic">◀◀</button><button class="ic">❚❚</button><button class="ic">▶▶</button></div></div>
    <div class="tile g sq"><button class="tg on">☾</button><small>Фокус</small></div>
    <div class="tile g sq"><button class="tg">⟳</button><small>Поворот</small></div>
    <div class="tile g vs" data-v="0.65"><span class="fill"></span><i>☀︎</i></div>
    <div class="tile g vs" data-v="0.4"><span class="fill"></span><i>♪</i></div>
  </div>
</section>

<!-- Настройки -->
<section id="settings" class="sheet g" hidden>
  <h3>Настройки стекла <button id="close" class="x">✕</button></h3>
  <label>Толщина <input data-k="thickness" type="range" min="0" max="60" value="24"></label>
  <label>Ободок <input data-k="bezel" type="range" min="4" max="60" value="20"></label>
  <label>Фрост <input data-k="blur" type="range" min="0" max="12" step="0.5" value="1"></label>
  <label>Слияние <input data-g="merge" type="range" min="0" max="60" value="30"></label>
  <label>Аберрация <input data-g="aberration" type="range" min="0" max="0.4" step="0.01" value="0.1"></label>
  <label>Блик <input data-g="specular" type="range" min="0" max="2" step="0.05" value="0.9"></label>
  <label>Тонировка <input data-g="tint" type="range" min="0" max="0.4" step="0.01" value="0.05"></label>
  <label>Увеличение <input data-g="magnify" type="range" min="0" max="0.2" step="0.005" value="0.03"></label>
  <div class="seg" id="light"><button data-l="fixed">Свет: фикс.</button><button data-l="pointer" class="on">указатель</button><button data-l="tilt">наклон</button></div>
  <label>Энергосбережение <input id="low" type="checkbox"></label>
  <div class="seg" id="walls"></div>
  <p class="links">Режим: <b id="mode"></b> · <a href="classic.html">классика (v2)</a> · <a href="dom.html">живой DOM (SVG)</a></p>
</section>

<script type="module" src="demo.js?v=v3-20261101"></script>
</body>
</html>
